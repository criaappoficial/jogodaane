<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7d4e6" />
<meta name="description" content="Meu Look Fashion: jogo de vestir boneca com 31 peças, estúdio de fotos, cores de cabelo e sons." />
<meta name="application-name" content="Meu Look Fashion" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Meu Look" />
<title>Meu Look Fashion</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23a72f63'/%3E%3Cpath d='M32 9c1.4 12.4 6.2 17.2 18.6 18.6C38.2 29.1 33.4 33.9 32 46.3 30.6 33.9 25.8 29.1 13.4 27.6 25.8 26.2 30.6 21.4 32 9Z' fill='%23ffd5e7'/%3E%3C/svg%3E" />
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; }

  :root {
    --ink: #47243a;
    --ink-soft: #7b5369;
    --ink-faint: #a0788e;
    --rose: #d64f88;
    --rose-deep: #a72f63;
    --rose-soft: #f7c3d8;
    --pink: #ffdcea;
    --pink-light: #fff3f8;
    --lilac: #c7a6ef;
    --lilac-deep: #8651bb;
    --gold: #d6a341;
    --gold-soft: #f8e5ad;
    --cream: #fffafc;
    --line: rgba(126, 57, 91, 0.13);
    --shadow-soft: 0 12px 30px rgba(104, 43, 73, 0.12);
    --shadow-card: 0 8px 20px rgba(110, 48, 80, 0.1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #f6cfe1;
  }

  body {
    position: fixed;
    inset: 0;
    width: 100%;
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(1100px 680px at 12% -12%, rgba(255, 236, 246, 0.98), transparent 58%),
      radial-gradient(900px 700px at 104% 8%, rgba(228, 209, 249, 0.92), transparent 55%),
      radial-gradient(900px 720px at 50% 112%, rgba(255, 197, 220, 0.95), transparent 62%),
      #f6cfe1;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:disabled {
    cursor: default;
    opacity: 0.42;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid rgba(134, 81, 187, 0.85);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .icon-sprite {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ic {
    width: 21px;
    height: 21px;
    display: block;
    flex: 0 0 auto;
  }

  #game {
    position: relative;
    width: min(100%, 460px);
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255, 255, 255, 0.95), transparent 62%),
      linear-gradient(180deg, #fff9fc 0%, #fdeef6 43%, #f7dbea 100%);
    box-shadow: 0 0 90px rgba(90, 33, 64, 0.21);
  }

  .ambient {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ambient::before,
  .ambient::after {
    content: "";
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(4px);
    opacity: 0.6;
  }

  .ambient::before {
    top: 16%;
    left: -150px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.92), transparent 68%);
  }

  .ambient::after {
    top: 46%;
    right: -170px;
    background: radial-gradient(circle, rgba(203, 168, 240, 0.38), transparent 68%);
  }

  .ambient-spark {
    position: absolute;
    display: block;
    color: rgba(255, 255, 255, 0.92);
    filter: drop-shadow(0 2px 9px rgba(223, 118, 166, 0.45));
    animation: float-spark 7.5s ease-in-out infinite, twinkle 4.4s ease-in-out infinite;
    will-change: transform, opacity;
  }

  .ambient-spark svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .ambient-spark.s1 { width: 13px; height: 13px; top: 8%; left: 7%; animation-delay: -1s, -2s; }
  .ambient-spark.s2 { width: 8px; height: 8px; top: 17%; right: 8%; animation-delay: -3s, -0.7s; color: #f6d78e; }
  .ambient-spark.s3 { width: 11px; height: 11px; top: 40%; left: 92%; animation-delay: -5s, -2.4s; }
  .ambient-spark.s4 { width: 9px; height: 9px; top: 56%; left: 4%; animation-delay: -2s, -3.2s; color: #f5c6dd; }
  .ambient-spark.s5 { width: 12px; height: 12px; top: 71%; right: 4%; animation-delay: -6s, -1.3s; }
  .ambient-spark.s6 { width: 7px; height: 7px; top: 33%; left: 5%; animation-delay: -4.4s, -4s; color: #f0d395; }

  @keyframes float-spark {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.92); }
    50% { transform: translate3d(5px, -13px, 0) rotate(12deg) scale(1.08); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.95; }
  }

  .topbar {
    position: relative;
    z-index: 3;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: max(10px, var(--safe-top)) 16px 4px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border-radius: 15px;
    color: #ffe3ef;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.22), transparent 48%),
      linear-gradient(140deg, #b93c74, #702b75);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 18px rgba(135, 45, 92, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .brand-mark .ic {
    width: 22px;
    height: 22px;
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 11px;
  }

  .brand-copy {
    min-width: 0;
  }

  .eyebrow {
    margin: 0 0 1px;
    color: var(--ink-faint);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.2em;
    line-height: 1.2;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 3px;
    font-family: "Bodoni 72", "Didot", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: clamp(22px, 6.1vw, 27px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.02;
    white-space: nowrap;
    color: var(--ink);
  }

  .title-star {
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    color: var(--gold);
    filter: drop-shadow(0 1px 3px rgba(214, 163, 65, 0.4));
    animation: twinkle 4.5s ease-in-out infinite;
  }

  h1 .title-main {
    background: linear-gradient(112deg, #4b263d 4%, #8c3167 70%, #a23a6e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 .fashion {
    font-style: italic;
    font-weight: 500;
    background: linear-gradient(112deg, #c33f78 8%, #a44191 58%, #7952b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .icon-button {
    position: relative;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 15px;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.94);
    box-shadow: 0 6px 16px rgba(110, 48, 80, 0.11), inset 0 1px 0 #fff;
    transition: transform 150ms ease, background-color 150ms ease;
    touch-action: manipulation;
  }

  .icon-button:active { transform: scale(0.94); background: #fff; }
  .icon-button:hover { background: #fff; }
  .icon-button .ic { width: 20px; height: 20px; }

  .actionbar {
    position: relative;
    z-index: 3;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 14px 6px;
  }

  .look-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 46px;
    padding: 5px 13px 5px 7px;
    border-radius: 16px;
    background: linear-gradient(150deg, #ffffff, #fff4f9);
    border: 1px solid rgba(255, 255, 255, 0.98);
    box-shadow: 0 6px 18px rgba(109, 46, 79, 0.1), inset 0 1px 0 #fff;
    flex: 1 1 auto;
    min-width: 82px;
    transition: box-shadow 220ms ease, border-color 220ms ease;
  }

  .look-pill.is-complete {
    border-color: rgba(214, 163, 65, 0.55);
    box-shadow: 0 0 0 2px rgba(214, 163, 65, 0.16), 0 7px 20px rgba(130, 87, 28, 0.13), inset 0 1px 0 #fff;
  }

  .look-pill.is-complete .look-icon {
    color: #8c5c14;
    background: linear-gradient(140deg, #fff5cc, #f0cf78);
  }

  .look-icon {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: 0 0 auto;
    border-radius: 11px;
    color: var(--rose-deep);
    background: linear-gradient(140deg, #ffe2ee, #f5c6dc);
  }

  .look-icon .ic { width: 17px; height: 17px; }

  .look-meta {
    display: flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
  }

  .look-meta b {
    font-family: "Bodoni 72", "Didot", Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
    color: var(--rose-deep);
    font-variant-numeric: tabular-nums;
  }

  .look-meta small {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .quick-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }

  .tool-btn {
    width: 47px;
    min-height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px 3px 3px;
    border-radius: 15px;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.96);
    box-shadow: 0 5px 15px rgba(110, 48, 80, 0.09);
    transition: transform 140ms ease, background-color 140ms ease, color 140ms ease;
    touch-action: manipulation;
  }

  .tool-btn .ic { width: 18px; height: 18px; }
  .tool-btn span { font-size: 7.5px; font-weight: 700; letter-spacing: 0.015em; line-height: 1.1; }

  .tool-btn:hover { background: #fff; color: var(--rose-deep); }
  .tool-btn:active { transform: scale(0.94); }
  .tool-btn.accent { color: #8d5b15; background: linear-gradient(150deg, #fffdf3, #fff1c9); }
  .tool-btn.rose { color: var(--rose-deep); background: linear-gradient(150deg, #fff, #ffe8f1); }

  .stage-area {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    padding: 0 12px 8px;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
    border-radius: 27px;
    border: 1px solid rgba(255, 255, 255, 0.96);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255, 255, 255, 0.8), transparent 64%),
      linear-gradient(164deg, rgba(255, 245, 250, 0.96), rgba(248, 215, 234, 0.9) 53%, rgba(236, 213, 244, 0.86));
    box-shadow:
      0 16px 38px rgba(105, 41, 75, 0.13),
      inset 0 1px 0 rgba(255, 255, 255, 0.92),
      inset 0 -24px 50px rgba(215, 146, 184, 0.1);
    isolation: isolate;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.85) 0.8px, transparent 0.8px);
    background-size: 16px 16px;
    opacity: 0.22;
    mask-image: linear-gradient(to bottom, #000, transparent 45%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 45%, transparent 100%);
    pointer-events: none;
  }

  .arch {
    position: absolute;
    left: 13%;
    right: 13%;
    top: 7%;
    bottom: 8%;
    border-radius: 999px 999px 28px 28px;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.23) 47%, rgba(255, 255, 255, 0.06) 70%),
      linear-gradient(180deg, rgba(255, 249, 252, 0.28), rgba(255, 255, 255, 0.1));
    border: 1px solid rgba(255, 255, 255, 0.78);
    box-shadow: inset 0 0 42px rgba(255, 255, 255, 0.33);
    pointer-events: none;
  }

  .arch::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: inherit;
    border: 1px dashed rgba(201, 136, 169, 0.27);
  }

  .stage-orbit {
    position: absolute;
    width: 86%;
    aspect-ratio: 1;
    left: 7%;
    top: 17%;
    border: 1px solid rgba(255, 255, 255, 0.48);
    border-radius: 50%;
    transform: rotate(-10deg) scaleY(0.83);
    pointer-events: none;
  }

  .stage-orbit::before,
  .stage-orbit::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.15);
  }

  .stage-orbit::before { top: 10%; right: 11%; }
  .stage-orbit::after { bottom: 13%; left: 8%; width: 4px; height: 4px; }

  .stage-floor {
    position: absolute;
    left: 16%;
    right: 16%;
    bottom: 5.5%;
    height: 9%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(142, 69, 107, 0.18), transparent 68%);
    filter: blur(2px);
    pointer-events: none;
  }

  .stage-hair {
    position: absolute;
    z-index: 8;
    top: 8px;
    left: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 5px 9px 5px 7px;
    border-radius: 999px;
    color: #823a63;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(122, 52, 88, 0.1);
    touch-action: manipulation;
    transition: background-color 160ms ease, box-shadow 160ms ease, transform 140ms ease;
  }

  .stage-hair::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: inherit;
  }

  .stage-hair:active { transform: scale(0.96); }
  .stage-hair:hover { background: #fff; }

  .stage-hair[aria-expanded="true"] {
    background: #fff;
    border-color: #edc2d6;
    box-shadow: 0 7px 18px rgba(130, 50, 90, 0.16), 0 0 0 2px rgba(214, 79, 136, 0.1);
  }

  .stage-hair .ic { width: 14px; height: 14px; color: #a74977; }

  .hair-dot {
    width: 11px;
    height: 11px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(140deg, #a86a4a, #5a3020);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.72), 0 1px 3px rgba(83, 33, 58, 0.2);
  }

  .stage-sound {
    position: absolute;
    z-index: 8;
    top: 7px;
    right: 8px;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 14px;
    color: #7d3a5f;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 14px rgba(122, 52, 88, 0.1);
    touch-action: manipulation;
    transition: background-color 160ms ease, color 160ms ease, transform 140ms ease;
  }

  .stage-sound::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
  }

  .stage-sound .ic { width: 19px; height: 19px; }
  .stage-sound:hover { background: #fff; }
  .stage-sound:active { transform: scale(0.94); }
  .stage-sound.is-off { color: #a38999; background: rgba(255, 255, 255, 0.55); }

  .hair-tray {
    position: absolute;
    z-index: 12;
    left: 9px;
    right: 9px;
    bottom: 9px;
    padding: 8px 10px 10px;
    border-radius: 18px;
    background: rgba(255, 250, 253, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.97);
    box-shadow: 0 14px 30px rgba(92, 35, 67, 0.22), inset 0 1px 0 #fff;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    animation: hair-tray-in 190ms ease-out both;
  }

  .hair-tray[hidden] { display: none; }

  .hair-tray-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    padding-left: 2px;
  }

  .hair-tray-title {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .hair-color-status {
    margin-left: auto;
    font-size: 8.5px;
    font-weight: 700;
    color: var(--rose-deep);
  }

  .hair-close {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    margin: -2px -4px -2px 0;
    flex: 0 0 auto;
    color: var(--ink-soft);
    background: #fff4f9;
    border: 1px solid #f1d7e4;
    border-radius: 9px;
  }

  .hair-close::before {
    content: "";
    position: absolute;
    inset: -8px;
  }

  .hair-close { position: relative; }
  .hair-close .ic { width: 13px; height: 13px; }

  .hair-swatches {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .hair-swatch {
    position: relative;
    display: grid;
    place-items: center;
    width: 33px;
    height: 33px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    background: linear-gradient(140deg, var(--hair-a), var(--hair-b));
    box-shadow: 0 3px 9px rgba(99, 38, 70, 0.19), inset 0 -5px 9px rgba(0, 0, 0, 0.1);
    touch-action: manipulation;
    transition: transform 150ms ease, outline-color 150ms ease;
  }

  .hair-swatch::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
  }

  .hair-swatch:hover { transform: translateY(-1px) scale(1.04); }
  .hair-swatch:active { transform: scale(0.93); }

  .hair-swatch.is-selected {
    outline: 2px solid #b23d72;
    outline-offset: 2px;
  }

  .hair-check {
    width: 13px;
    height: 13px;
    color: #fff;
    opacity: 0;
    filter: drop-shadow(0 1px 2px rgba(60, 20, 40, 0.35));
    transition: opacity 120ms ease;
  }

  .hair-swatch.is-selected .hair-check { opacity: 1; }

  .stage.is-hair-open .stage-hint { opacity: 0; }

  @keyframes hair-tray-in {
    from { opacity: 0; transform: translateY(7px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .doll-wrap {
    position: absolute;
    inset: 10px 2px 30px;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    padding: 8px 0 2px;
  }

  #dollSvg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 14px 16px rgba(90, 36, 65, 0.13));
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage-hint {
    position: absolute;
    z-index: 5;
    left: 50%;
    bottom: 9px;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    background: rgba(84, 32, 58, 0.17);
    filter: blur(3px);
  }

  .drag-ghost.is-over-target {
    filter: drop-shadow(0 0 13px rgba(214, 163, 65, 0.8)) drop-shadow(0 10px 15px rgba(88, 32, 61, 0.22));
  }

  .toast-host {
    position: absolute;
    z-index: 40;
    top: calc(max(10px, var(--safe-top)) + 122px);
    left: 50%;
    width: min(calc(100% - 30px), 400px);
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
    padding: 9px 13px 9px 10px;
    border-radius: 999px;
    color: var(--ink);
    background: rgba(255, 253, 254, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.94);
    box-shadow: 0 12px 26px rgba(94, 36, 68, 0.18), 0 2px 7px rgba(94, 36, 68, 0.08);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.25;
    text-align: left;
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
    transition: opacity 190ms ease, transform 220ms cubic-bezier(0.2, 0.9, 0.25, 1.2);
  }

  .toast.is-showing {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .toast-icon {
    display: grid;
    place-items: center;
    width: 25px;
    height: 25px;
    flex: 0 0 auto;
    border-radius: 50%;
    color: var(--rose-deep);
    background: linear-gradient(145deg, #ffe5f0, #f9cede);
  }

  .toast-icon .ic { width: 14px; height: 14px; }
  .toast.is-gold .toast-icon { color: #8a5b0f; background: linear-gradient(145deg, #fff8dd, #f8e2a4); }
  .toast.is-lilac .toast-icon { color: #7042a3; background: linear-gradient(145deg, #f4eaff, #e4d0f8); }
  .toast.is-error .toast-icon { color: #a72f63; background: linear-gradient(145deg, #ffe4eb, #ffcad9); }

  .loading-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    margin-left: 2px;
    border-radius: 50%;
    background: currentColor;
    animation: loading-bop 700ms ease-in-out infinite alternate;
  }

  .loading-dot:nth-child(2) { animation-delay: 150ms; }
  .loading-dot:nth-child(3) { animation-delay: 300ms; }

  @keyframes loading-bop {
    from { transform: translateY(0); opacity: 0.35; }
    to { transform: translateY(-3px); opacity: 1; }
  }

  .shake {
    animation: gentle-shake 360ms ease;
  }

  @keyframes gentle-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    55% { transform: translateX(3px); }
    78% { transform: translateX(-1.5px); }
  }

  @media (max-height: 720px) {
    .topbar { padding-top: max(7px, var(--safe-top)); }
    .brand-mark { width: 38px; height: 38px; border-radius: 13px; }
    .eyebrow { display: none; }
    h1 { font-size: 23px; }
    .actionbar { padding-bottom: 5px; }
    .look-pill { min-height: 43px; }
    .tool-btn { min-height: 44px; }
    .stage-area { padding-bottom: 6px; }
    .stage-hair { top: 7px; left: 7px; min-height: 34px; padding: 4px 8px 4px 6px; }
    .stage-sound { top: 6px; right: 7px; width: 36px; height: 36px; }
    .hair-tray { left: 7px; right: 7px; bottom: 7px; padding: 7px 9px 8px; }
    .hair-swatch { width: 31px; height: 31px; }
    .wardrobe { padding-top: 6px; padding-bottom: calc(7px + var(--safe-bottom)); }
    .grabber { margin-bottom: 2px; }
    .closet-head { min-height: 28px; margin-bottom: 3px; }
    .closet-sub { display: none; }
    .restore-btn { min-height: 36px; }
    .cats { min-height: 44px; margin-bottom: 5px; }
    .cat { min-height: 36px; }
    .rail { min-height: 98px; margin-bottom: 4px; }
    .item-card { height: 96px; flex-basis: 87px; width: 87px; }
    .item-preview { width: 68px; height: 60px; }
    .item-name { font-size: 8.7px; height: 19px; }
    .action-button { min-height: 44px; }
    .stage-hint { padding: 5px 9px; }
    .toast-host { top: calc(max(7px, var(--safe-top)) + 108px); }
    .photo-modal { gap: 7px; padding: 10px; border-radius: 22px; }
    .photo-frame { max-height: 52dvh; min-height: 170px; }
    .modal-title { font-size: 18px; }
    .photo-actions .action-button { min-height: 44px; }
  }

  @media (max-width: 370px) {
    .topbar { padding-left: 12px; padding-right: 12px; }
    .actionbar { padding-left: 10px; padding-right: 10px; gap: 5px; }
    .quick-tools { gap: 4px; }
    .tool-btn { width: 44px; }
    .look-pill { padding-right: 9px; }
    .brand { gap: 8px; }
    h1 { font-size: 21px; }
    .brand-mark { width: 38px; height: 38px; }
    .wardrobe { padding-left: 9px; padding-right: 9px; }
    .cat { font-size: 7.8px; gap: 2px; }
    .cat .ic { width: 12px; height: 12px; }
    .item-card { flex-basis: 86px; width: 86px; }
    .item-preview { width: 68px; }
    .action-button { gap: 3px; padding: 6px 4px; font-size: 9.2px; }
    .action-button .ic { width: 14px; height: 14px; }
    .photo-actions .action-button { font-size: 9.4px; }
  }

  @media (min-width: 600px) and (min-height: 760px) {
    body {
      display: grid;
      place-items: center;
    }

    #game {
      height: min(100dvh - 32px, 960px);
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.75);
    }

    .wardrobe {
      border-radius: 27px 27px 34px 34px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.001ms !important;
    }

    .photo-count.is-pop {
      opacity: 1;
      transform: none;
    }

    .photo-flash.is-flashing {
      animation: none;
      opacity: 0;
    }
  }
</style>

  function getAudioContext() {
    if (!state.soundOn) return null;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    try {
      if (!audio.ctx) {
        audio.ctx = new AudioContextClass();
        audio.master = audio.ctx.createGain();
        audio.master.gain.value = 0.72;
        audio.master.connect(audio.ctx.destination);
      }
      if (audio.ctx.state === 'suspended') {
        audio.ctx.resume().catch(() => {});
      }
      return audio.ctx;
    } catch (_) {
      return null;
    }
  }

  function tone(freq, options = {}) {
    const ctx = getAudioContext();
    if (!ctx) return;
    try {
      const {
        duration = 0.08,
        delay = 0,
        type = 'sine',
        volume = 0.05,
        endFreq = null,
      } = options;
      const start = ctx.currentTime + delay;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, start);
      if (endFreq) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), start + duration);
      }
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audio.master);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.03);
    } catch (_) { /* audio must never interrupt the game */ }
  }

  function noiseBurst(duration = 0.07, volume = 0.045, highpass = 1200) {
    const ctx = getAudioContext();
    if (!ctx) return;
    try {
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i += 1) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / length);
      }
      const source = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      source.buffer = buffer;
      filter.type = 'highpass';
      filter.frequency.value = highpass;
      gain.gain.value = volume;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.master);
      source.start();
    } catch (_) { /* audio must never interrupt the game */ }
  }

  function launchConfetti() {
    if (prefersReducedMotion() || !els.confettiLayer) return;
    const colors = ['#e3558c', '#f6c453', '#a780e0', '#ffffff', '#f49bbd', '#83b7de'];
    const stageHeight = els.stage.clientHeight || 320;
    els.confettiLayer.innerHTML = '';
    const count = 24;
    for (let i = 0; i < count; i += 1) {
      const piece = document.createElement('span');
      const width = 4 + Math.random() * 5;
      const height = 5 + Math.random() * 8;
      piece.className = 'confetti-piece';
      piece.style.left = `${4 + Math.random() * 92}%`;
      piece.style.width = `${width}px`;
      piece.style.height = `${height}px`;
      piece.style.background = colors[i % colors.length];
      piece.style.borderRadius = Math.random() < 0.4 ? '50%' : '2px';
      els.confettiLayer.appendChild(piece);
      const drift = (Math.random() - 0.5) * 130;
      const rotation = (Math.random() - 0.5) * 900;
      try {
        const animation = piece.animate(
          [
            { transform: 'translate3d(0, -16px, 0) rotate(0deg)', opacity: 0, offset: 0 },
            { opacity: 1, offset: 0.1 },
            { opacity: 1, offset: 0.76 },
            { transform: `translate3d(${drift}px, ${stageHeight + 32}px, 0) rotate(${rotation}deg)`, opacity: 0, offset: 1 },
          ],
          {
            duration: 1500 + Math.random() * 900,
            delay: Math.random() * 360,
            easing: 'cubic-bezier(0.22, 0.6, 0.35, 1)',
            fill: 'both',
          }
        );
        animation.finished.then(() => piece.remove()).catch(() => piece.remove());
      } catch (_) {
        piece.remove();
      }
    }
  }

  function celebrateLook() {
    state.celebrationTimer = 0;

    }
    playCongratulations();
    showToast('Parabéns! Seu look está pronto!', 'gold', 'i-star', 3000);
    launchConfetti();
  }

  function checkLookCompletion(delay = 520) {
    if (!isLookComplete()) {
      state.lookCompleted = false;
      window.clearTimeout(state.celebrationTimer);
      state.celebrationTimer = 0;
      return;
    }
    if (state.lookCompleted) return;
    state.lookCompleted = true;
    window.clearTimeout(state.celebrationTimer);
    state.celebrationTimer = window.setTimeout(celebrateLook, delay);
  }

  function updateRailNav() {
    const rail = els.rail;
    if (!rail) return;
    const maxScroll = Math.max(0, rail.scrollWidth - rail.clientWidth);
    const hasOverflow = maxScroll > 2;
    els.btnRailPrev.disabled = !hasOverflow || rail.scrollLeft <= 2;
    els.btnRailNext.disabled = !hasOverflow || rail.scrollLeft >= maxScroll - 2;
    els.railProgress.classList.toggle('is-hidden', !hasOverflow);
    if (!hasOverflow) return;
    const visibleRatio = Math.min(1, rail.clientWidth / rail.scrollWidth);
    const thumbWidth = Math.min(100, Math.max(visibleRatio * 100, 16));
    const progress = maxScroll > 0 ? rail.scrollLeft / maxScroll : 0;
    els.railProgressThumb.style.width = `${thumbWidth}%`;
    els.railProgressThumb.style.left = `${progress * (100 - thumbWidth)}%`;
  }

  function scrollRailBy(direction) {
    const maxScroll = Math.max(0, els.rail.scrollWidth - els.rail.clientWidth);
    if (maxScroll <= 2) return;
    const amount = Math.max(150, els.rail.clientWidth * 0.78);
    els.rail.scrollBy({
      left: direction * amount,
      behavior: prefersReducedMotion() ? 'auto' : 'smooth',
    });
    playTap();
  }

  function renderDoll(animateZones = null) {
    const animate = animateZones ? new Set(animateZones) : new Set();
    els.clothingLayer.innerHTML = '';

    if (els.baseBandeau) {
      els.baseBandeau.style.display = state.equipped.top || state.equipped.dress ? 'none' : '';
    }
    if (els.baseBriefs) {
      els.baseBriefs.style.display = state.equipped.bottom || state.equipped.dress ? 'none' : '';
    }

    ZONE_ORDER.forEach((zone) => {
      const item = currentItemForZone(zone);
      if (!item) return;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('class', 'equipped-piece' + (animate.has(zone) ? ' is-new' : ''));
      group.dataset.zone = zone;
      group.dataset.item = item.id;
      group.innerHTML = scopedSvg(item);
      els.clothingLayer.appendChild(group);
    });

    syncCardStates();
    updateStageHint();
    updateClosetCount();
    els.lookPill.classList.toggle('is-complete', isLookComplete());
  }

  function renderRail() {
    const items = state.filter === 'all' ? ITEMS : byCategory[state.filter];
    if (!items.length) {
      els.rail.innerHTML = '<div class="rail-empty">Nenhuma peça nesta categoria.</div>';
      updateClosetCount();
      requestAnimationFrame(updateRailNav);
      return;
    }

    els.rail.innerHTML = items.map((item) => {
      const active = equippedIds().has(item.id);
      const label = `Vestir ${item.name}. Toque para vestir ou arraste até a área certa da boneca.`;
      return `
        <button class="item-card" type="button" data-id="${item.id}" aria-label="${label}" aria-pressed="${active}" title="${item.name}">
          <span class="equipped-badge" aria-hidden="true"><svg class="ic"><use href="#i-check"></use></svg></span>
          <span class="item-preview" aria-hidden="true">${previewSvg(item)}</span>
          <span class="item-name">${item.name}</span>
        </button>
      `;
    }).join('');

    syncCardStates();
    updateClosetCount();
    requestAnimationFrame(updateRailNav);
  }

  function setFilter(filter, announce = true) {
    if (!['all', 'clothes', 'shoes', 'accessories'].includes(filter)) return;
    state.filter = filter;
    els.cats.forEach((button) => {
      const active = button.dataset.filter === filter;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    els.rail.scrollLeft = 0;
    renderRail();
    if (announce) {
      const labels = {
        all: 'Mostrando todas as peças.',
        clothes: 'Mostrando roupas.',
        shoes: 'Mostrando sapatos.',
        accessories: 'Mostrando acessórios.',
      };
      showToast(labels[filter], 'lilac', 'i-grid', 1200);
    }
  }

  function showToast(message, tone = 'rose', icon = 'i-heart', duration = 1900) {
    window.clearTimeout(state.toastTimer);
    const toneClass = tone === 'rose' ? '' : ` is-${tone}`;
    els.toastHost.innerHTML = `
      <div class="toast${toneClass}">
        <span class="toast-icon"><svg class="ic" aria-hidden="true"><use href="#${icon}"></use></svg></span>
        <span>${message}</span>
      </div>
    `;
    const toast = $('.toast', els.toastHost);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => toast.classList.add('is-showing'));
    });
    state.toastTimer = window.setTimeout(() => {
      toast.classList.remove('is-showing');
      window.setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 250);
    }, duration);
  }

  function pushHistory() {
    state.history.push({
      equipped: { ...state.equipped },
      lookCount: state.lookCount,
      hairColor: state.hairColor,
    });
    if (state.history.length > 25) state.history.shift();
    updateControls();
  }

  function equipItem(item, source = 'tap') {
    if (!item) return;

    if (state.equipped[item.zone] === item.id) {
      showToast('Essa peça já está no look.', 'lilac', 'i-check', 1500);
      return;
    }

    pushHistory();

    if (item.zone === 'dress') {
      delete state.equipped.top;
      delete state.equipped.bottom;
    } else if (item.zone === 'top' || item.zone === 'bottom') {
      delete state.equipped.dress;
    }

    state.equipped[item.zone] = item.id;
    state.lookCount += 1;

    renderDoll([item.zone]);
    updateControls();

    const messagesByZone = {
      dress: ['Que look lindo!', 'Vestido perfeito!', 'Arrasei!'],
      top: ['Combinação linda!', 'Blusa escolhida com estilo!', 'Ficou perfeita!'],
      bottom: ['Look em construção!', 'Essa peça ficou incrível!', 'Que charme!'],
      feet: ['Sapato escolhido!', 'Um passo mais fashion!', 'Pisada de passarela!'],
      neck: ['Toque de elegância!', 'Brilho no pescoço!', 'Look refinado!'],
      earrings: ['Brilho nas orelhas!', 'Detalhe delicado!', 'Brinco combinando!'],
      head: ['Acessório poderoso!', 'Detalhe que brilha!', 'Cabeça de passarela!'],
      hand: ['Bolsa combinando!', 'Look completo!', 'Estilo na mão!'],
    };
    const messages = messagesByZone[item.zone] || ['Que look lindo!'];
    const message = source === 'drop'
      ? 'Encaixou perfeitamente!'
      : messages[Math.floor(Math.random() * messages.length)];
    if (source === 'drop') playDrop(); else playEquip();
    showToast(message, source === 'drop' ? 'gold' : 'rose', source === 'drop' ? 'i-star' : 'i-heart');
    checkLookCompletion(620);
  }

  function undo() {
    if (!state.history.length) {
      showToast('Nada para desfazer ainda.', 'lilac', 'i-undo', 1500);
      return;
    }
    const snapshot = state.history.pop();
    state.equipped = { ...snapshot.equipped };
    state.lookCount = snapshot.lookCount;
    if (snapshot.hairColor) applyHairColor(snapshot.hairColor);
    hideZoneHint(true);
    renderDoll();
    updateControls();
    playUndo();
    showToast('Desfeito!', 'lilac', 'i-undo', 1500);
    checkLookCompletion(360);
  }

  function removeAll() {
    if (!Object.keys(state.equipped).length) {
      showToast('A boneca já está sem roupas.', 'lilac', 'i-shirt', 1500);
      return;
    }
    pushHistory();
    state.lastLook = { ...state.equipped };
    state.lastHair = state.hairColor;
    state.equipped = {};
    state.lookCount += 1;
    hideZoneHint(true);
    renderDoll();
    updateControls();
    playWhoosh();
    showToast('Todas as peças foram removidas.', 'rose', 'i-shirt');
    checkLookCompletion(0);
  }

  function randomLook() {
    const pick = (items) => items[Math.floor(Math.random() * items.length)];
    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    pushHistory();
    state.lastLook = { ...state.equipped };
    state.lastHair = state.hairColor;

    const next = {};
    if (Math.random() < 0.58) {
      next.dress = pick(byZone.dress).id;
    } else {
      next.top = pick(byZone.top).id;
      next.bottom = pick(byZone.bottom).id;
    }
    next.feet = pick(byZone.feet).id;

    const accessoryZones = shuffle(['neck', 'head', 'earrings', 'hand']);
    const accessoryCount = Math.floor(Math.random() * 4);
    for (let i = 0; i < accessoryCount; i += 1) {
      const zone = accessoryZones[i];
      next[zone] = pick(byZone[zone]).id;
    }

    const newHair = pick(HAIR_COLORS).id;
    applyHairColor(newHair);

    state.equipped = next;
    state.lookCount += 1;
    hideZoneHint(true);
    renderDoll(Object.keys(next));
    updateControls();
    playSparkle();
    showToast('Look aleatório arrasou!', 'gold', 'i-sparkles', 1900);
    checkLookCompletion(650);
  }

  function newLook() {
    pushHistory();
    state.lastLook = { ...state.equipped };
    state.lastHair = state.hairColor;
    state.equipped = {};
    state.lookCount += 1;
    hideZoneHint(true);
    renderDoll();
    updateControls();
    playTap();
    showToast('Novo look pronto para criar!', 'lilac', 'i-sparkles', 1700);
    checkLookCompletion(0);
  }

  function restoreLook() {
    const hasSavedLook = state.lastLook && Object.keys(state.lastLook).length > 0;
    if (!hasSavedLook && !state.lastHair) {
      showToast('Nenhum look guardado ainda.', 'error', 'i-restore', 1600);
      return;
    }
    pushHistory();
    state.equipped = { ...(state.lastLook || {}) };
    if (state.lastHair) applyHairColor(state.lastHair);
    state.lookCount += 1;
    hideZoneHint(true);
    renderDoll(Object.keys(state.equipped));
    updateControls();
    playSparkle();
    showToast('Look restaurado!', 'lilac', 'i-restore', 1700);
    checkLookCompletion(520);
  }

  function resetGame() {
    cancelPointerDrag(true);
    if (els.confettiLayer) els.confettiLayer.innerHTML = '';
    setHairTray(false, { focus: false });
    state.equipped = {};
    state.lookCount = 0;
    state.history = [];
    state.lastLook = null;
    state.lastHair = null;
    hideZoneHint(true);
    applyHairColor(DEFAULT_HAIR);
    setFilter('all', false);
    renderDoll();
    updateControls();
    playReset();
    window.clearTimeout(state.celebrationTimer);
    state.celebrationTimer = 0;
    state.lookCompleted = false;
    showToast('Jogo reiniciado. Vamos criar!', 'rose', 'i-reset', 1700);
  }

  function svgPointFromEvent(clientX, clientY) {
    const svg = els.dollSvg;
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return { x: -1, y: -1 };
    const svgP = pt.matrixTransform(ctm.inverse());
    return { x: svgP.x, y: svgP.y };
  }

  function pointInZone(point, zoneName, tolerance = 6) {
    const zone = ZONES[zoneName];
    if (!zone) return false;
    return (
      point.x >= zone.x - tolerance &&
      point.x <= zone.x + zone.w + tolerance &&
      point.y >= zone.y - tolerance &&
      point.y <= zone.y + zone.h + tolerance
    );
  }

  function renderZoneHint(zoneName, stateClass = '') {
    const zone = ZONES[zoneName];
    if (!zone) return;
    if (state.hintZone !== zoneName || !$('.zone-shape', els.zoneHint)) {
      state.hintZone = zoneName;
      els.zoneHint.innerHTML = `<rect class="zone-shape" x="${zone.x}" y="${zone.y}" width="${zone.w}" height="${zone.h}" rx="14"/>`;
    }
    const shape = $('.zone-shape', els.zoneHint);
    if (!shape) return;
    shape.classList.toggle('is-valid', stateClass === 'valid');
    shape.classList.toggle('is-error', stateClass === 'error');
  }

  function hideZoneHint(immediate = false) {
    const clear = () => {
      els.zoneHint.innerHTML = '';
      state.hintZone = null;
    };
    if (immediate) {
      clear();
      return;
    }
    window.setTimeout(() => {
      if (!state.drag) clear();
    }, 150);
  }

  function makeGhost(item, clientX, clientY) {
    const ghost = document.createElement('div');
    const widths = { dress: 90, top: 74, bottom: 78, feet: 62, neck: 46, head: 72, hand: 58 };
    ghost.className = 'drag-ghost';
    ghost.style.width = `${widths[item.zone] || 78}px`;
    ghost.style.left = `${clientX}px`;
    ghost.style.top = `${clientY}px`;
    ghost.innerHTML = `<svg viewBox="${getItemBBox(item)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">${scopedSvg(item)}</svg>`;
    document.body.appendChild(ghost);
    return ghost;
  }

  function startDrag(event) {
    const drag = state.drag;
    if (!drag || drag.dragging) return;
    drag.dragging = true;
    drag.ghost.classList.add('is-visible');
    drag.card.classList.add('is-dragging');
    document.body.classList.add('is-dragging');
    els.toastHost.innerHTML = '';
    try { drag.card.setPointerCapture(event.pointerId); } catch (_) { /* capture is optional */ }
    drag.ghost.style.left = `${event.clientX}px`;
    drag.ghost.style.top = `${event.clientY}px`;
    updateDragHover(event.clientX, event.clientY);
    playTap();
    if (navigator.vibrate) {
      try { navigator.vibrate(8); } catch (_) { /* optional feedback */ }
    }
  }

  function updateDragHover(clientX, clientY) {
    const drag = state.drag;
    if (!drag || !drag.dragging) return;
    const point = svgPointFromEvent(clientX, clientY);
    const valid = pointInZone(point, drag.item.zone);
    drag.ghost.classList.toggle('is-over-target', valid);
    renderZoneHint(drag.item.zone, valid ? 'valid' : '');
  }

  function cancelPointerDrag(removeGhost = false) {
    const drag = state.drag;
    if (drag) {
      if (drag.card) drag.card.classList.remove('is-dragging');
      if (removeGhost && drag.ghost) drag.ghost.remove();
      state.drag = null;
    }
    document.body.classList.remove('is-dragging');
    hideZoneHint(true);
  }

  function finishGhost(ghost, mode, card) {
    if (!ghost) return;
    if (prefersReducedMotion()) {
      ghost.remove();
      return;
    }

    if (mode === 'reject' && card) {
      const cardRect = card.getBoundingClientRect();
      const fromX = parseFloat(ghost.style.left) || cardRect.left;
      const fromY = parseFloat(ghost.style.top) || cardRect.top;
      const toX = cardRect.left + cardRect.width / 2;
      const toY = cardRect.top + cardRect.height / 2;
      const animation = ghost.animate(
        [
          { left: `${fromX}px`, top: `${fromY}px`, opacity: 1, transform: 'translate(-50%, -54%) rotate(-4deg) scale(0.96)' },
          { left: `${fromX + (toX - fromX) * 0.22}px`, top: `${fromY + (toY - fromY) * 0.22}px`, opacity: 0.95, transform: 'translate(-50%, -54%) rotate(6deg) scale(0.88)', offset: 0.28 },
          { left: `${toX}px`, top: `${toY}px`, opacity: 0, transform: 'translate(-50%, -50%) rotate(0deg) scale(0.3)' },
        ],
        { duration: 340, easing: 'cubic-bezier(0.33, 0.8, 0.3, 1)' }
      );
      animation.finished.then(() => ghost.remove()).catch(() => ghost.remove());
      return;
    }

    const animation = ghost.animate(
      [
        { opacity: 1, transform: 'translate(-50%, -54%) rotate(-4deg) scale(0.96)' },
        { opacity: 1, transform: 'translate(-50%, -56%) rotate(2deg) scale(1.1)', offset: 0.38 },
        { opacity: 0, transform: 'translate(-50%, -58%) rotate(0deg) scale(0.62)' },
      ],
      { duration: 300, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)' }
    );
    animation.finished.then(() => ghost.remove()).catch(() => ghost.remove());
  }

  function onRailPointerDown(event) {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    const card = event.target.closest('.item-card');
    if (!card || !els.rail.contains(card)) return;
    const item = byId.get(card.dataset.id);
    if (!item) return;

    if (!els.hairTray.hidden) setHairTray(false, { focus: false });
    if (state.drag) cancelPointerDrag(true);

    const ghost = makeGhost(item, event.clientX, event.clientY);
    state.drag = {
      pointerId: event.pointerId,
      pointerType: event.pointerType,
      card,
      item,
      startX: event.clientX,
      startY: event.clientY,
      x: event.clientX,
      y: event.clientY,
      ghost,
      dragging: false,
      cancelled: false,
    };

    if (event.pointerType === 'mouse') {
      try { card.setPointerCapture(event.pointerId); } catch (_) { /* ignore */ }
    }
  }

  function onPointerMove(event) {
    const drag = state.drag;
    if (!drag || drag.pointerId !== event.pointerId) return;

    drag.x = event.clientX;
    drag.y = event.clientY;

    if (!drag.dragging) {
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      const distance = Math.hypot(dx, dy);
      if (distance < 6) return;

      const horizontalIntent = Math.abs(dx) > Math.abs(dy) * 1.15;
      if (drag.pointerType !== 'mouse' && horizontalIntent) {
        drag.cancelled = true;
        drag.ghost.remove();
        state.drag = null;
        document.body.classList.remove('is-dragging');
        return;
      }
      startDrag(event);
    }

    if (event.cancelable) event.preventDefault();
    drag.ghost.style.left = `${event.clientX}px`;
    drag.ghost.style.top = `${event.clientY}px`;
    updateDragHover(event.clientX, event.clientY);
  }

  function onPointerUp(event) {
    const drag = state.drag;
    if (!drag || drag.pointerId !== event.pointerId) return;

    if (drag.dragging) {
      if (event.cancelable) event.preventDefault();
      const point = svgPointFromEvent(event.clientX, event.clientY);
      const valid = pointInZone(point, drag.item.zone);
      drag.ghost.classList.remove('is-over-target');
      drag.card.classList.remove('is-dragging');
      document.body.classList.remove('is-dragging');

      if (valid) {
        renderZoneHint(drag.item.zone, 'valid');
        finishGhost(drag.ghost, 'success');
        const item = drag.item;
        state.drag = null;
        equipItem(item, 'drop');
        window.setTimeout(() => hideZoneHint(true), 190);
      } else {
        renderZoneHint(drag.item.zone, 'error');
        finishGhost(drag.ghost, 'reject', drag.card);
        const item = drag.item;
        state.drag = null;
        showToast('Arraste para a área certa!', 'error', 'i-grab', 2000);
        playError();
        els.stage.classList.remove('shake');
        void els.stage.offsetWidth;
        els.stage.classList.add('shake');
        window.setTimeout(() => {
          els.stage.classList.remove('shake');
          hideZoneHint(true);
        }, 900);
      }
      return;
    }

    const item = drag.item;
    drag.ghost.remove();
    state.drag = null;
    document.body.classList.remove('is-dragging');
    equipItem(item, 'tap');
  }

  function onPointerCancel(event) {
    const drag = state.drag;
    if (!drag || drag.pointerId !== event.pointerId) return;
    cancelPointerDrag(true);
  }

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Falha ao carregar o SVG exportado.'));
      image.src = source;
    });
  }

  function drawSpark(ctx, x, y, radius, color, opacity = 1) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - radius);
    ctx.bezierCurveTo(x + radius * 0.18, y - radius * 0.35, x + radius * 0.35, y - radius * 0.18, x + radius, y);
    ctx.bezierCurveTo(x + radius * 0.35, y + radius * 0.18, x + radius * 0.18, y + radius * 0.35, x, y + radius);
    ctx.bezierCurveTo(x - radius * 0.18, y + radius * 0.35, x - radius * 0.35, y + radius * 0.18, x - radius, y);
    ctx.bezierCurveTo(x - radius * 0.35, y - radius * 0.18, x - radius * 0.18, y - radius * 0.35, x, y - radius);
    ctx.fill();
    ctx.restore();
  }

  function triggerDownload(dataUrl, filename) {
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = filename;
    link.rel = 'noopener';
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function createDollClone(options = {}) {
    const { scopeIds = false } = options;
    const clone = els.dollSvg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', '200');
    clone.setAttribute('height', '420');
    const hint = clone.querySelector('#zoneHint');
    if (hint) hint.innerHTML = '';
    clone.querySelectorAll('.equipped-piece').forEach((node) => node.classList.remove('is-new'));
    return scopeIds ? scopeSvgIds(clone) : clone;
  }

  function scopeSvgIds(root) {
    const suffix = `-look-${Date.now()}-${Math.floor(Math.random() * 9999)}`;
    const nodes = [root, ...root.querySelectorAll('*')];
    const idMap = new Map();
    nodes.forEach((node) => {
      if (node.id) {
        const replacement = `${node.id}${suffix}`;
        idMap.set(node.id, replacement);
        node.id = replacement;
      }
    });
    const attrs = ['fill', 'stroke', 'filter', 'clip-path', 'mask', 'style'];
    nodes.forEach((node) => {
      attrs.forEach((attr) => {
        const value = node.getAttribute(attr);
        if (value && value.includes('url(#')) {
          node.setAttribute(attr, value.replace(/url\(#([^)]+)\)/g, (match, id) => {
            const replacement = idMap.get(id);
            return replacement ? `url(#${replacement})` : match;
          }));
        }
      });
      ['href', 'xlink:href'].forEach((attr) => {
        const value = node.getAttribute(attr);
        if (value && value.startsWith('#')) {
          const replacement = idMap.get(value.slice(1));
          if (replacement) node.setAttribute(attr, `#${replacement}`);
        }
      });
    });
    root.removeAttribute('id');
    return root;
  }

  async function getDollImage() {
    if (typeof XMLSerializer === 'undefined') throw new Error('XMLSerializer indisponível.');
    const clone = createDollClone();
    const xml = new XMLSerializer().serializeToString(clone);
    if (!xml || !xml.includes('<svg')) throw new Error('SVG vazio.');
    const source = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(xml)}`;
    return loadImage(source);
  }

  function roundedRect(ctx, x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  function createPhotoDataUrl(image) {
    const width = 900;
    const height = 1320;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('Canvas indisponível.');

    const background = ctx.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, '#ffeef7');
    background.addColorStop(0.55, '#f8d8e9');
    background.addColorStop(1, '#e7cdec');
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(112, 127, 185, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#dfc7f0';
    ctx.beginPath();
    ctx.arc(815, 1140, 230, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawSpark(ctx, 75, 125, 20, '#ffffff', 0.75);
    drawSpark(ctx, 840, 250, 14, '#f1c86b', 0.85);
    drawSpark(ctx, 72, 1130, 11, '#f5bfd8', 0.8);
    drawSpark(ctx, 812, 1000, 17, '#ffffff', 0.7);

    ctx.save();
    ctx.shadowColor = 'rgba(79, 28, 55, 0.22)';
    ctx.shadowBlur = 48;
    ctx.shadowOffsetY = 18;
    ctx.fillStyle = '#fffdfd';
    roundedRect(ctx, 34, 30, 832, 1260, 30);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#fffdfd';
    roundedRect(ctx, 34, 30, 832, 1260, 30);
    ctx.fill();

    const photoX = 72;
    const photoY = 68;
    const photoW = 756;
    const photoH = 1002;

    ctx.save();
    roundedRect(ctx, photoX, photoY, photoW, photoH, 10);
    ctx.clip();
    const photoBackground = ctx.createLinearGradient(0, photoY, 0, photoY + photoH);
    photoBackground.addColorStop(0, '#fff7fb');
    photoBackground.addColorStop(0.52, '#fbe3f0');
    photoBackground.addColorStop(1, '#ecd7f1');
    ctx.fillStyle = photoBackground;
    ctx.fillRect(photoX, photoY, photoW, photoH);

    const halo = ctx.createRadialGradient(
      photoX + photoW / 2,
      photoY + 390,
      50,
      photoX + photoW / 2,
      photoY + 390,
      390
    );
    halo.addColorStop(0, 'rgba(255,255,255,0.98)');
    halo.addColorStop(0.64, 'rgba(255,255,255,0.4)');
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(photoX, photoY, photoW, photoH);

    ctx.strokeStyle = 'rgba(255,255,255,0.84)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(photoX + photoW / 2, photoY + 460, 260, 430, 0, 0, Math.PI * 2);
    ctx.stroke();

    const dollHeight = 928;
    const dollWidth = (dollHeight / 420) * 200;
    const dollX = photoX + (photoW - dollWidth) / 2;
    const dollY = photoY + 42;
    ctx.drawImage(image, dollX, dollY, dollWidth, dollHeight);

    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath();
    ctx.ellipse(photoX + photoW / 2, photoY + 978, 200, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawSpark(ctx, 112, 180, 12, '#ffffff', 0.9);
    drawSpark(ctx, 795, 860, 10, '#f4cf78', 0.75);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6c2d56';
    ctx.font = 'italic 600 45px Georgia, "Times New Roman", serif';
    ctx.fillText('Meu Look Fashion', width / 2, 1153);

    ctx.fillStyle = 'rgba(108,45,86,0.58)';
    ctx.font = '700 14px "Segoe UI", Arial, sans-serif';
    ctx.fillText('FOTO DO ATELIÊ', width / 2, 1184);

    ctx.strokeStyle = 'rgba(180,103,141,0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(325, 1211);
    ctx.lineTo(575, 1211);
    ctx.stroke();

    drawSpark(ctx, 300, 1211, 6, '#d5a341', 0.8);
    drawSpark(ctx, 600, 1211, 6, '#d5a341', 0.8);

    ctx.fillStyle = 'rgba(108,45,86,0.44)';
    ctx.font = '600 12px "Segoe UI", Arial, sans-serif';
    ctx.fillText('UM LOOK FEITO COM CARINHO', width / 2, 1248);
    ctx.restore();

    const dataUrl = canvas.toDataURL('image/png');
    if (!dataUrl || !dataUrl.startsWith('data:image/png') || dataUrl.length < 100) {
      throw new Error('A foto não pôde ser gerada.');
    }
    return dataUrl;
  }

  async function saveLook() {
    if (state.saveBusy) return;
    state.saveBusy = true;
    els.btnSave.disabled = true;
    els.btnSave.classList.add('is-busy');
    const label = $('span', els.btnSave);
    const previousLabel = label.textContent;
    label.textContent = 'Preparando';
    showToast('Preparando sua imagem...', 'lilac', 'i-image', 1100);

    try {
      const image = await getDollImage();

      const width = 720;
      const height = 1440;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Canvas indisponível.');

      const background = ctx.createLinearGradient(0, 0, 0, height);
      background.addColorStop(0, '#fff7fb');
      background.addColorStop(0.45, '#fde7f1');
      background.addColorStop(1, '#efcfe5');
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);

      const halo = ctx.createRadialGradient(width / 2, 610, 40, width / 2, 610, 420);
      halo.addColorStop(0, 'rgba(255,255,255,0.92)');
      halo.addColorStop(0.68, 'rgba(255,255,255,0.32)');
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.82)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(width / 2, 610, 250, 505, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      drawSpark(ctx, 93, 155, 19, '#ffffff', 0.88);
      drawSpark(ctx, 626, 227, 13, '#f4ce7c', 0.9);
      drawSpark(ctx, 108, 1090, 10, '#f7c1d9', 0.85);
      drawSpark(ctx, 618, 1002, 16, '#ffffff', 0.82);
      drawSpark(ctx, 653, 430, 8, '#ffffff', 0.7);
      drawSpark(ctx, 67, 600, 7, '#eac073', 0.65);

      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.beginPath();
      ctx.ellipse(width / 2, 1302, 178, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.drawImage(image, 60, 58, 600, 1260);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#6c2d56';
      ctx.font = 'italic 600 37px Georgia, "Times New Roman", serif';
      ctx.fillText('Meu Look Fashion', width / 2, 1373);
      ctx.fillStyle = 'rgba(108,45,86,0.55)';
      ctx.font = '700 13px "Segoe UI", Arial, sans-serif';
      ctx.fillText('UM LOOK FEITO COM CARINHO', width / 2, 1402);
      ctx.restore();

      const dataUrl = canvas.toDataURL('image/png');
      if (!dataUrl || !dataUrl.startsWith('data:image/png') || dataUrl.length < 100) {
        throw new Error('A imagem não pôde ser gerada.');
      }

      triggerDownload(dataUrl, `meu-look-fashion-${Date.now()}.png`);
      playPhotoReady();
      showToast('Look salvo! A imagem foi baixada.', 'gold', 'i-image', 2100);
    } catch (error) {
      console.error('Erro ao salvar o look:', error);
      playError();
      showToast('Não foi possível salvar a imagem. Tente novamente.', 'error', 'i-alert', 2600);
    } finally {
      state.saveBusy = false;
      els.btnSave.disabled = false;
      els.btnSave.classList.remove('is-busy');
      label.textContent = previousLabel;
    }
  }

  function setGameInert(inert) {
    ['.topbar', '.actionbar', '.stage-area', '.wardrobe'].forEach((selector) => {
      const element = $(selector, els.game);
      if (!element) return;
      if (inert) {
        element.setAttribute('inert', '');
        element.setAttribute('aria-hidden', 'true');
      } else {
        element.removeAttribute('inert');
        element.removeAttribute('aria-hidden');
      }
    });
  }

  function getFocusable(container) {
    return $$('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])', container)
      .filter((element) => element.offsetParent !== null);
  }

  function trapFocusInModal(event) {
    if (event.key !== 'Tab') return;
    const container = $('.photo-modal', els.photoOverlay);
    if (!container) return;
    const focusable = getFocusable(container);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (!container.contains(document.activeElement)) {
      event.preventDefault();
      first.focus();
      return;
    }
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function startPhotoCountdown(session) {
    let count = 3;
    const step = () => {
      if (state.photoSession !== session) return;
      if (count > 0) {
        els.photoCount.textContent = String(count);
        els.photoCount.classList.remove('is-pop');
        void els.photoCount.offsetWidth;
        els.photoCount.classList.add('is-pop');
        playTick(count);
        count -= 1;
        state.photoTimer = window.setTimeout(step, 820);
      } else {
        els.photoCount.textContent = '';
        takePhoto(session);
      }
    };
    state.photoTimer = window.setTimeout(step, 420);
  }

  async function takePhoto(session) {
    if (state.photoSession !== session) return;
    els.photoFlash.classList.remove('is-flashing');
    void els.photoFlash.offsetWidth;
    els.photoFlash.classList.add('is-flashing');
    playShutter();
    els.photoCaption.textContent = 'Revelando sua foto...';

    try {
      const image = await getDollImage();
      if (state.photoSession !== session) return;
      const dataUrl = createPhotoDataUrl(image);
      if (state.photoSession !== session) return;
      state.photoDataUrl = dataUrl;
      els.photoResult.src = dataUrl;
      els.photoPreview.hidden = true;
      els.photoResult.hidden = false;
      els.photoOverlay.classList.add('is-ready');
      els.photoTitle.textContent = 'Seu look em foco';
      els.photoCaption.textContent = 'Sua foto ficou pronta!';
      els.btnPhotoDownload.disabled = false;
      playPhotoReady();
      els.btnPhotoDownload.focus({ preventScroll: true });
    } catch (error) {
      console.error('Erro ao tirar a foto:', error);
      if (state.photoSession !== session) return;
      els.photoCount.textContent = '';
      els.photoTitle.textContent = 'Ops!';
      els.photoCaption.textContent = 'Não foi possível tirar a foto. Tente novamente.';
      playError();
    }
  }

  function openPhotoStudio() {
    if (!els.photoOverlay.hidden) return;
    setHairTray(false, { focus: false });
    hideZoneHint(true);
    window.clearTimeout(state.toastTimer);
    window.clearTimeout(state.celebrationTimer);
    state.celebrationTimer = 0;
    els.toastHost.innerHTML = '';
    state.photoSession += 1;
    const session = state.photoSession;
    state.photoDataUrl = null;

    els.photoOverlay.hidden = false;
    requestAnimationFrame(() => {
      if (state.photoSession === session && !els.photoOverlay.hidden) {
        els.photoOverlay.classList.add('is-open');
        els.btnPhotoClose.focus({ preventScroll: true });
      }
    });
    setGameInert(true);
    els.photoTitle.textContent = 'Prepare a pose';
    els.photoCaption.textContent = 'Deixe o look pronto e sorria.';
    els.btnPhotoDownload.disabled = true;
    els.photoResult.hidden = true;
    els.photoResult.removeAttribute('src');
    els.photoPreview.hidden = false;
    els.photoPreview.innerHTML = '';
    els.photoCount.textContent = '';
    els.photoOverlay.classList.remove('is-ready');

    const clone = createDollClone({ scopeIds: true });
    clone.removeAttribute('role');
    clone.removeAttribute('aria-label');
    clone.setAttribute('aria-hidden', 'true');
    clone.setAttribute('focusable', 'false');
    clone.classList.add('photo-doll');
    els.photoPreview.appendChild(clone);

    playTap();
    startPhotoCountdown(session);  }

  function closePhotoStudio() {
    if (els.photoOverlay.hidden) return;
    state.photoSession += 1;
    window.clearTimeout(state.photoTimer);
    state.photoTimer = 0;
    els.photoOverlay.classList.remove('is-open', 'is-ready');
    setGameInert(false);
    state.photoDataUrl = null;
    playTap();

    const finishClose = () => {
      if (els.photoOverlay.classList.contains('is-open')) return;
      els.photoOverlay.hidden = true;
      els.photoPreview.innerHTML = '';
      els.photoResult.hidden = true;
      els.photoResult.removeAttribute('src');
      els.photoCount.textContent = '';
      els.photoCaption.textContent = 'Deixe o look pronto e sorria.';
    };

    if (prefersReducedMotion()) finishClose();
    else window.setTimeout(finishClose, 200);

    els.btnPhoto.focus({ preventScroll: true });
  }

  function downloadPhoto() {
    if (!state.photoDataUrl) return;
    triggerDownload(state.photoDataUrl, `meu-look-foto-${Date.now()}.png`);
    els.photoCaption.textContent = 'Foto baixada!';
    playPhotoReady();
  }

  function changeHairColor(colorId) {
    if (colorId === state.hairColor) return;
    pushHistory();
    state.lookCount += 1;
    applyHairColor(colorId, { announce: true });
    updateControls();
  }

  function isStandalonePwa() {
    return (
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      navigator.standalone === true
    );
  }

  function isIosLike() {
    const ua = navigator.userAgent || '';
    const iPadDesktop = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    return /iPad|iPhone|iPod/i.test(ua) || iPadDesktop;
  }

  function canUsePwa() {
    return (
      window.isSecureContext &&
      (location.protocol === 'https:' || location.protocol === 'http:')
    );
  }

  function updateInstallUi() {
    if (!els.btnInstall) return;
    const show = !isStandalonePwa() && canUsePwa() && (Boolean(deferredInstallPrompt) || isIosLike());
    els.btnInstall.hidden = !show;
  }

  async function installPwa() {
    if (deferredInstallPrompt) {
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      try {
        promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
          showToast('Instalando o aplicativo...', 'gold', 'i-install', 2200);
        }
      } catch (_) {
        /* The browser may reject a stale install prompt. */
      }
      updateInstallUi();
      return;
    }

    const message = isIosLike()
      ? 'No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.'
      : 'Abra o menu do navegador e escolha Instalar aplicativo.';
    showToast(message, 'lilac', 'i-install', 4200);
  }

  function setupPwa() {
    updateInstallUi();

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      updateInstallUi();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      updateInstallUi();
      playPhotoReady();
      showToast('Aplicativo instalado!', 'gold', 'i-install', 2400);
    });

    if ('serviceWorker' in navigator && canUsePwa()) {
      const register = () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.warn('Service worker não registrado:', error && error.message ? error.message : error);
        });
      };
      if (document.readyState === 'complete') register();
      else window.addEventListener('load', register, { once: true });
    }
  }

  function handleGlobalKeydown(event) {
    if (!els.photoOverlay.hidden && els.photoOverlay.classList.contains('is-open')) {
      if (event.key === 'Escape') {
        event.preventDefault();
        closePhotoStudio();
        return;
      }
      trapFocusInModal(event);
      return;
    }
    if (!els.hairTray.hidden && event.key === 'Escape') {
      event.preventDefault();
      setHairTray(false);
    }
  }

  function bindEvents() {
    els.btnReset.addEventListener('click', resetGame);
    els.btnUndo.addEventListener('click', undo);
    els.btnRemove.addEventListener('click', removeAll);
    els.btnRandom.addEventListener('click', randomLook);
    els.btnRestore.addEventListener('click', restoreLook);
    els.btnSave.addEventListener('click', saveLook);
    els.btnNew.addEventListener('click', newLook);
    els.btnInstall.addEventListener('click', installPwa);
    els.btnPhoto.addEventListener('click', openPhotoStudio);
    els.btnPhotoClose.addEventListener('click', closePhotoStudio);
    els.btnPhotoCancel.addEventListener('click', closePhotoStudio);
    els.btnPhotoDownload.addEventListener('click', downloadPhoto);
    els.photoOverlay.addEventListener('click', (event) => {
      if (event.target.closest('[data-close-photo]')) closePhotoStudio();
    });

    els.btnSound.addEventListener('click', () => {
      const turningOn = !state.soundOn;
      setSoundEnabled(turningOn, false);
      if (turningOn) {
        tone(660, { duration: 0.08, type: 'sine', volume: 0.03 });
        tone(880, { duration: 0.12, delay: 0.07, type: 'sine', volume: 0.025 });
        showToast('Sons ativados!', 'rose', 'i-volume', 1200);
      } else {
        showToast('Sons desativados.', 'lilac', 'i-volume-off', 1200);
      }
    });

    els.btnHair.addEventListener('click', () => {
      toggleHairTray();
    });
    els.btnHairClose.addEventListener('click', () => setHairTray(false));
    els.hairSwatches.addEventListener('click', (event) => {
      const button = event.target.closest('.hair-swatch');
      if (!button) return;
      changeHairColor(button.dataset.hair);
    });

    els.cats.forEach((button) => {
      button.addEventListener('click', () => {
        setFilter(button.dataset.filter, false);
        playTap();
      });
    });

    els.rail.addEventListener('pointerdown', onRailPointerDown);
    els.rail.addEventListener('click', (event) => {
      const card = event.target.closest('.item-card');
      if (!card || !els.rail.contains(card)) return;
      if (event.detail === 0) equipItem(byId.get(card.dataset.id), 'keyboard');
    });
    els.rail.addEventListener('contextmenu', (event) => {
      if (event.target.closest('.item-card')) event.preventDefault();
    });
    els.rail.addEventListener('dragstart', (event) => event.preventDefault());
    els.btnRailPrev.addEventListener('click', () => scrollRailBy(-1));
    els.btnRailNext.addEventListener('click', () => scrollRailBy(1));
    els.rail.addEventListener('scroll', updateRailNav, { passive: true });
    els.rail.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      scrollRailBy(event.key === 'ArrowRight' ? 1 : -1);
    });
    els.rail.addEventListener('wheel', (event) => {
      const maxScroll = Math.max(0, els.rail.scrollWidth - els.rail.clientWidth);
      if (maxScroll <= 2) return;
      if (Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;
      event.preventDefault();
      const delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
      els.rail.scrollLeft += delta;
    }, { passive: false });
    window.addEventListener('resize', () => requestAnimationFrame(updateRailNav));

    els.game.addEventListener('click', (event) => {
      if (els.hairTray.hidden) return;
      if (event.target.closest('#hairTray') || event.target.closest('#btnHair') || event.target.closest('#photoOverlay')) return;
      setHairTray(false, { focus: false });
    });

    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
    window.addEventListener('blur', () => cancelPointerDrag(true));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelPointerDrag(true);
    });
    document.addEventListener('keydown', handleGlobalKeydown);
  }

  function init() {
    const ids = new Set();
    ITEMS.forEach((item) => {
      if (ids.has(item.id)) throw new Error(`ID de peça duplicado: ${item.id}`);
      ids.add(item.id);
      if (!ZONES[item.zone]) throw new Error(`Zona inválida em ${item.id}: ${item.zone}`);
    });
    buildHairSwatches();
    setSoundEnabled(true, false);
    bindEvents();
    setupPwa();
    renderRail();
    renderDoll();
    updateControls();
    updateClosetCount();
  }

  init();
})();
</script>
</body>
</html>
